name: Build iSH-ARM64 (Fork)

on:
  workflow_dispatch:

jobs:
  build-fork:
    runs-on: macos-14
    steps:
      - name: Checkout del repositorio con submódulos
        uses: actions/checkout@v3
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Instalar dependencias del sistema (Meson, Ninja, LLVM)
        run: |
          brew install ninja lld llvm meson

      - name: Parchear globalmente todas las variables atómicas con NULL en el código C
        run: |
          python3 -c '
          import glob, re
          
          # Patrón mejorado que maneja espacios y saltos de línea alrededor del = NULL
          pattern = re.compile(r"(static\s+_Atomic\s*\([^)]+\)\s+\w+)\s*=\s*NULL\s*;", re.DOTALL)
          
          for filepath in glob.glob("**/*.[ch]", recursive=True):
              try:
                  with open(filepath, "r", encoding="utf-8") as f:
                      content = f.read()
                  
                  # Reemplazar manteniendo solo la declaración sin el = NULL
                  new_content = pattern.sub(r"\1;", content)
                  
                  if new_content != content:
                      with open(filepath, "w", encoding="utf-8") as f:
                          f.write(new_content)
                      print(f"Patcheado globalmente: {filepath}")
              except Exception as e:
                  pass
          '
      - name: Parchear compatibilidad del fork para macOS 2
        run: |
          sed -i '' 's/static _Atomic(ish_timer_tick_hook_t) g_timer_tick_hook = NULL;/static _Atomic(ish_timer_tick_hook_t) g_timer_tick_hook;/' kernel/calls.c
          sed -i '' 's/static _Atomic(ish_fork_guard_t) g_fork_guard = NULL;/static _Atomic(ish_fork_guard_t) g_fork_guard;/' kernel/fork.c
          sed -i '' 's/posix_spawn_file_actions_addchdir(/posix_spawn_file_actions_addchdir_np(/g' kernel/native_offload.c
          sed -i '' 's/static _Atomic(fakefs_path_translate_hook_t) g_path_translate_hook = NULL;/static _Atomic(fakefs_path_translate_hook_t) g_path_translate_hook;/' fs/fake.c
          sed -i '' 's/static _Atomic(fakefs_path_reverse_hook_t) g_path_reverse_hook = NULL;/static _Atomic(fakefs_path_reverse_hook_t) g_path_reverse_hook;/' fs/fake.c
      - name: Configurar y compilar el backend ARM64 con Meson
        run: |
          mkdir -p build-ios
          meson setup build-ios . -Dguest_arch=arm64 --buildtype=release
          ninja -C build-ios

      - name: Buscar dinámicamente el Workspace de Xcode
        run: |
          # Busca el primer .xcworkspace en el repositorio
          WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 3 | head -n 1)
          
          if [ -z "$WORKSPACE" ]; then
            echo "❌ No se encontró ningún .xcworkspace"
            exit 1
          fi
          
          echo "✅ Workspace encontrado: $WORKSPACE"
          # Guardamos la ruta para que los siguientes pasos la usen
          echo "XCODE_WORKSPACE=$WORKSPACE" >> $GITHUB_ENV

      - name: Compilar la App de iOS sin firma (Dinámico)
        run: |
          xcodebuild -workspace "$XCODE_WORKSPACE" \
                     -scheme iSH \
                     -sdk iphoneos \
                     -configuration Release \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Preparar y empaquetar el archivo IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "iSH.app" -type d | grep "Release-iphoneos" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ No se encontró la ruta de iSH.app"
            exit 1
          fi
          echo "✅ Aplicación encontrada en: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r iSH-unsigned.ipa Payload
          echo "✅ IPA generado con éxito: iSH-unsigned.ipa"

      - name: Subir artefacto IPA
        uses: actions/upload-artifact@v4
        with:
          name: iSH-ARM64-Unsigned
          path: iSH-unsigned.ipa
