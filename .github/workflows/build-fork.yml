name: Build iSH-ARM64 (Fork)

on:
  workflow_dispatch:

jobs:
  build-fork:
    runs-on: macos-14
    steps:
      - name: Checkout del repositorio con submódulos
        uses: actions/checkout@v3
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Instalar dependencias del sistema (Meson, Ninja, LLVM)
        run: |
          brew install ninja lld llvm meson

      - name: Parchear compatibilidad atómica en el kernel
        run: |
          sed -i '' 's/static _Atomic(ish_timer_tick_hook_t) g_timer_tick_hook = NULL;/static _Atomic(ish_timer_tick_hook_t) g_timer_tick_hook;/' kernel/calls.c
          sed -i '' 's/static _Atomic(ish_fork_guard_t) g_fork_guard = NULL;/static _Atomic(ish_fork_guard_t) g_fork_guard;/' kernel/fork.c
          
      - name: Configurar y compilar el backend ARM64 con Meson
        run: |
          mkdir -p build-ios
          meson setup build-ios . -Dguest_arch=arm64 --buildtype=release
          ninja -C build-ios

      - name: Compilar la App de iOS sin firma
        run: |
          xcodebuild -workspace App.xcworkspace \
                     -scheme iSH \
                     -sdk iphoneos \
                     -configuration Release \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build
