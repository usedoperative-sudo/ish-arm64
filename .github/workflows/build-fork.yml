name: Build iSH-ARM64 (Fork)

on:
  workflow_dispatch:

jobs:
  build-fork:
    runs-on: macos-14
    steps:
      - name: Checkout del repositorio con submódulos
        uses: actions/checkout@v3
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Instalar dependencias del sistema (Meson, Ninja, LLVM)
        run: |
          brew install ninja lld llvm meson

      - name: Parchear globalmente todas las variables atómicas con NULL en el código C
        run: |
          python3 -c '
          import glob, re
          
          # Patrón mejorado que maneja espacios y saltos de línea alrededor del = NULL
          pattern = re.compile(r"(static\s+_Atomic\s*\([^)]+\)\s+\w+)\s*=\s*NULL\s*;", re.DOTALL)
          
          for filepath in glob.glob("**/*.[ch]", recursive=True):
              try:
                  with open(filepath, "r", encoding="utf-8") as f:
                      content = f.read()
                  
                  # Reemplazar manteniendo solo la declaración sin el = NULL
                  new_content = pattern.sub(r"\1;", content)
                  
                  if new_content != content:
                      with open(filepath, "w", encoding="utf-8") as f:
                          f.write(new_content)
                      print(f"Patcheado globalmente: {filepath}")
              except Exception as e:
                  pass
          '
          
      - name: Configurar y compilar el backend ARM64 con Meson
        run: |
          mkdir -p build-ios
          meson setup build-ios . -Dguest_arch=arm64 --buildtype=release
          ninja -C build-ios

      - name: Compilar la App de iOS sin firma
        run: |
          xcodebuild -workspace App.xcworkspace \
                     -scheme iSH \
                     -sdk iphoneos \
                     -configuration Release \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build
