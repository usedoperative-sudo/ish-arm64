name: Build iSH-ARM64 (Fork)

on:
  workflow_dispatch:

jobs:
  build-fork:
    runs-on: macos-14 # O macos-15 según prefieras
    steps:
      - name: Checkout del repositorio con submódulos
        uses: actions/checkout@v3
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Instalar dependencias del sistema (Meson, Ninja, LLVM)
        run: |
          brew install ninja lld llvm meson

      - name: Configurar y compilar el backend ARM64 con Meson
        run: |
          # Creamos el directorio de compilación para el fork
          mkdir -p build-ios
          
          # Inicializamos Meson apuntando a la raíz (.) y especificando el guest_arch para ARM64
          meson setup build-ios . -Dguest_arch=arm64 --buildtype=release
          
          # Compilamos el núcleo estático con Ninja
          ninja -C build-ios

      - name: Compilar la App de iOS sin firma (para evitar errores de certificates)
        run: |
          # Si el proyecto usa un Workspace o un Proyect (.xcodeproj / .xcworkspace)
          # Asegúrate de ajustar el nombre del archivo workspace/project si es diferente.
          xcodebuild -workspace App.xcworkspace \
                     -scheme iSH \
                     -sdk iphoneos \
                     -configuration Release \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build
