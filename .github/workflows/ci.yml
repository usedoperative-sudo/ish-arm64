name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [clang, gcc]
        kernel: [linux]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-dev libunicorn-dev
          pip3 install meson ninja

      - name: Clone Linux
        run: deps/clone-linux.sh

      - name: Build
        run: |
          meson setup build -Dengine=asbestos -Dkernel=${{ matrix.kernel }}
          ninja -C build
        env:
          CC: ${{ matrix.cc }}

      - name: Test
        run: ninja -C build test

  build-mac:
    runs-on: macos-15
    strategy:
      matrix:
        kernel: [ish, linux]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install llvm lld ninja libarchive meson

      - name: Clone Linux
        if: ${{ matrix.kernel == 'linux' }}
        run: deps/clone-linux.sh

      - name: Build iSH Kernel
        if: ${{ matrix.kernel == 'ish' }}
        run: |
          xcodebuild -project iSH.xcodeproj \
            -scheme iSH \
            -arch arm64 \
            -sdk iphoneos \
            GCC_PREPROCESSOR_DEFINITIONS='$(inherited) dump_wx_stats()=' \
            OTHER_LDFLAGS='$(inherited) -Wl,-undefined,dynamic_lookup' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Linux Kernel
        if: ${{ matrix.kernel == 'linux' }}
        run: |
          xcodebuild -project iSH.xcodeproj \
            -scheme iSH+Linux \
            -arch x86_64 \
            -sdk iphonesimulator \
            GCC_PREPROCESSOR_DEFINITIONS='$(inherited) dump_wx_stats()=' \
            CODE_SIGNING_ALLOWED=NO
